[package]
name = "mantis-net"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[dependencies]
mantis-core = { path = "../core" }
mantis-adapter-contract = { path = "../adapter-contract" }
quinn = { workspace = true }
tokio = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
bytes = { workspace = true }
# The public web PKI roots, for clients trusting a publicly issued game
# certificate (feature `public-roots`, off by default).
webpki-roots = { workspace = true, optional = true }

[features]
public-roots = ["dep:webpki-roots"]

[dev-dependencies]
mantis-testkit = { path = "../testkit" }

[lints]
workspace = true
