[package]
name = "mantis-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Mantis renderer: render graph, GPU-driven scene, lighting, materials, crowds, streaming, post."

[dependencies]
mantis-core = { path = "../core" }
mantis-formats = { path = "../formats" }
mantis-shadergen = { path = "../shadergen" }
mantis-ui = { path = "../ui" }
wgpu = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
pollster = { workspace = true }

[dev-dependencies]
mantis-testkit = { path = "../testkit" }
# The noop backend lets GPU-API validation tests run on any machine.
wgpu = { workspace = true, features = ["noop"] }

[lints]
workspace = true
