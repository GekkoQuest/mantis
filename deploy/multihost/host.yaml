# Owner: deploy-engine
# The multi-host demonstration, part two: one "machine" with its own cell host, its own
# private network and its own game ports (compose projects mantis-host-a and
# mantis-host-b, from this one file):
#
#   MANTIS_HOST=a  MANTIS_WAN_IP=10.88.0.10  MANTIS_TCP_PORT=7401  docker compose -p mantis-host-a -f host.yaml up -d
#   MANTIS_HOST=b  MANTIS_WAN_IP=10.88.0.11  MANTIS_TCP_PORT=7411  docker compose -p mantis-host-b -f host.yaml up -d
#
# (scripts/deploy-multihost.ps1 does this.) The cell host reaches the service roles only
# over the shared `wan` network, by the names the signed registry lists, and is reached
# there as cells.host-<x>.mantis. Native clients reach its game listener only through the
# gateway, which dials the address it advertises on `wan` (MANTIS_WAN_IP:7400); its game
# certificate (cluster CA) names that address and the gateway's hosts_name. Only the legacy
# (plaintext TCP) port is published, on 127.0.0.1: that protocol has no gateway.

services:
  cell-host:
    image: mantis/cell-host:dev
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    secrets:
      - cluster_key
      - { source: cell_crt, target: tls_cert }
      - { source: cell_key, target: tls_key }
      - { source: game_crt, target: game_cert }
      - { source: game_key, target: game_key }
    volumes:
      - ./config/cells-${MANTIS_HOST:?a or b}.toml:/etc/mantis/node.toml:ro
      - ../local/multihost/keys/deploy.pub:/etc/mantis/deploy.pub:ro
      - ../local/multihost/keys/ca.crt:/etc/mantis/ca.crt:ro
      - ../../packages/toy/cooked:/content/toy:ro
      - cells:/var/lib/mantis/state
      - ../local/multihost/out-${MANTIS_HOST}:/var/lib/mantis/out
    networks:
      lan: {}
      wan: { aliases: ["cells.host-${MANTIS_HOST}.mantis"], ipv4_address: "${MANTIS_WAN_IP:?}" }
    ports:
      - "127.0.0.1:${MANTIS_TCP_PORT:?}:7401/tcp"

networks:
  wan:
    external: true
    name: mantis_wan
  # This machine's own network: the game ports are published from here.
  lan:
    driver_opts: { com.docker.network.bridge.enable_ip_masquerade: "false" }

volumes:
  cells:

secrets:
  cluster_key: { file: ../local/multihost/keys/cluster.key }
  cell_crt: { file: "../local/multihost/certs/cells-${MANTIS_HOST}.crt" }
  cell_key: { file: "../local/multihost/certs/cells-${MANTIS_HOST}.key" }
  game_crt: { file: "../local/multihost/certs/game-${MANTIS_HOST}.crt" }
  game_key: { file: "../local/multihost/certs/game-${MANTIS_HOST}.key" }
