# Owner: deploy-engine
# The cell-host node cells-b of the multi-host demonstration (deploy/multihost). Its registry is
# fetched over HTTPS from the registry server, pinned to the cluster CA, and re-read every 5 s.
[node]
role = "cell-host"
instance = "cells-b"
registry = "https://registry.svc.mantis:8443/registry.toml"
registry_ca = "/etc/mantis/ca.crt"
registry_refresh_s = 5
deploy_key = "/etc/mantis/deploy.pub"
cluster_key = "/run/secrets/cluster_key"
tls_cert = "/run/secrets/tls_cert"
tls_key = "/run/secrets/tls_key"
listen_rpc = "0.0.0.0:7520"
listen_health = "0.0.0.0:7620"
ready_timeout_s = 300
drain_grace_ms = 20000

[cell_host]
# What the realm hands to clients: the port this "host" publishes on loopback.
advertise = "127.0.0.1:7410"
state = "/var/lib/mantis/state"
poll_ms = 100
snapshot_every_ticks = 150

[package]
quic = "0.0.0.0:7400"
tcp = "0.0.0.0:7401"
cert_out = "/var/lib/mantis/out/toy-cert.der"
cooked = "/content/toy"
seed = 1
first_cell = 11
world = 1
