# Owner: deploy-engine
# A full local cluster, one container per role (plan 10), with PostgreSQL as the system of
# record. Started and stopped by scripts/deploy-local.ps1 and scripts/deploy-down.ps1, which
# also generate what this file mounts from deploy/local/ (keys, secrets, the signed
# registry) and build the images (deploy/containers/).
#
# Networks:
#   services  internal (no route out): RPC and health between roles, and PostgreSQL. Fixed
#             addresses, because the signed registry lists ip:port, never names.
#   game      the gateway and the cell host's game listeners; no masquerade (below). Native
#             clients reach the game only through the gateway (127.0.0.1:7400/udp, published
#             from it); the gateway reaches the cell host here (10.78.0.20:7400). The legacy
#             (plaintext TCP) adapter has no form for a gateway: legacy clients keep dialling
#             the cell host's own published port (127.0.0.1:7401/tcp).
#   ops       the Ops dashboard only, published to 127.0.0.1. The dashboard listens on
#             this network's address alone: it is never on the game network, and never
#             on the services network either.
# Every published port binds 127.0.0.1.
#
# Runtime: MANTIS_RUNTIME=debian (default: debian-slim, a shell for operators) or
# MANTIS_RUNTIME=distroless (no shell; health checks are `mantisd probe` either way).
#
# Secrets (cluster key, each node's TLS certificate and key, live-data key, operator token,
# database password and connection string) are files mounted under /run/secrets, never
# environment variables. Every RPC between roles is mutual TLS: the signed registry carries
# the cluster CA, and each node's certificate names its cluster, role and instance.
#
# Bots (profile `bots`, scripts/deploy-bots.ps1): headless clients that log in through the
# account and realm roles with the gateway's certificate (the gateway's login flow) and play
# through the gateway, from inside the cluster's networks (the roles are not published).

name: mantis

x-node: &node
  restart: unless-stopped
  stop_grace_period: 30s
  read_only: true
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: mantis
      POSTGRES_DB: mantis
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks:
      services: { ipv4_address: 10.77.0.4 }
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mantis", "-d", "mantis"]
      interval: 2s
      timeout: 3s
      retries: 30

  persist:
    <<: *node
    image: mantis/persist:dev
    build: { context: ../containers, dockerfile: persist.Containerfile, args: { RUNTIME: "mantis/runtime-${MANTIS_RUNTIME:-debian}:dev" } }
    depends_on: { postgres: { condition: service_healthy } }
    secrets:
      - cluster_key
      - pg_conn
      - { source: persist-1_crt, target: tls_cert }
      - { source: persist-1_key, target: tls_key }
    volumes:
      - ./config/persist.toml:/etc/mantis/node.toml:ro
      - ../local/registry.toml:/etc/mantis/registry.toml:ro
      - ../local/keys/deploy.pub:/etc/mantis/deploy.pub:ro
    networks:
      services: { ipv4_address: 10.77.0.5 }

  account:
    <<: *node
    image: mantis/account:dev
    build: { context: ../containers, dockerfile: account.Containerfile, args: { RUNTIME: "mantis/runtime-${MANTIS_RUNTIME:-debian}:dev" } }
    secrets:
      - cluster_key
      - { source: account-1_crt, target: tls_cert }
      - { source: account-1_key, target: tls_key }
    volumes:
      - ./config/account.toml:/etc/mantis/node.toml:ro
      - ../local/registry.toml:/etc/mantis/registry.toml:ro
      - ../local/keys/deploy.pub:/etc/mantis/deploy.pub:ro
    networks:
      services: { ipv4_address: 10.77.0.11 }

  realm:
    <<: *node
    image: mantis/realm:dev
    build: { context: ../containers, dockerfile: realm.Containerfile, args: { RUNTIME: "mantis/runtime-${MANTIS_RUNTIME:-debian}:dev" } }
    secrets:
      - cluster_key
      - { source: realm-1_crt, target: tls_cert }
      - { source: realm-1_key, target: tls_key }
    volumes:
      - ./config/realm.toml:/etc/mantis/node.toml:ro
      - ../local/registry.toml:/etc/mantis/registry.toml:ro
      - ../local/keys/deploy.pub:/etc/mantis/deploy.pub:ro
    networks:
      services: { ipv4_address: 10.77.0.12 }

  social:
    <<: *node
    image: mantis/social:dev
    build: { context: ../containers, dockerfile: social.Containerfile, args: { RUNTIME: "mantis/runtime-${MANTIS_RUNTIME:-debian}:dev" } }
    secrets:
      - cluster_key
      - { source: social-1_crt, target: tls_cert }
      - { source: social-1_key, target: tls_key }
    volumes:
      - ./config/social.toml:/etc/mantis/node.toml:ro
      - ../local/registry.toml:/etc/mantis/registry.toml:ro
      - ../local/keys/deploy.pub:/etc/mantis/deploy.pub:ro
    networks:
      services: { ipv4_address: 10.77.0.13 }

  matchmaking:
    <<: *node
    image: mantis/matchmaking:dev
    build: { context: ../containers, dockerfile: matchmaking.Containerfile, args: { RUNTIME: "mantis/runtime-${MANTIS_RUNTIME:-debian}:dev" } }
    secrets:
      - cluster_key
      - { source: matchmaking-1_crt, target: tls_cert }
      - { source: matchmaking-1_key, target: tls_key }
    volumes:
      - ./config/matchmaking.toml:/etc/mantis/node.toml:ro
      - ../local/registry.toml:/etc/mantis/registry.toml:ro
      - ../local/keys/deploy.pub:/etc/mantis/deploy.pub:ro
    networks:
      services: { ipv4_address: 10.77.0.14 }

  ops:
    <<: *node
    image: mantis/ops:dev
    build: { context: ../containers, dockerfile: ops.Containerfile, args: { RUNTIME: "mantis/runtime-${MANTIS_RUNTIME:-debian}:dev" } }
    secrets:
      - cluster_key
      - live_key
      - operator_token
      - { source: ops-1_crt, target: tls_cert }
      - { source: ops-1_key, target: tls_key }
    volumes:
      - ./config/ops.toml:/etc/mantis/node.toml:ro
      - ../local/registry.toml:/etc/mantis/registry.toml:ro
      - ../local/keys/deploy.pub:/etc/mantis/deploy.pub:ro
      - ../local/out:/var/lib/mantis/out
    networks:
      services: { ipv4_address: 10.77.0.15 }
      ops: { ipv4_address: 10.79.0.10, gw_priority: 1 }
    ports:
      - "127.0.0.1:7480:7480/tcp"

  # Standbys: a second instance of each failover role, holding no lease until the active
  # one's lapses (deploy/compose/config/<role>-2.toml). Ops-2's dashboard is published on
  # 127.0.0.1:7481 and serves only while it is the active Ops.
  account-2:
    <<: *node
    image: mantis/account:dev
    build: { context: ../containers, dockerfile: account.Containerfile, args: { RUNTIME: "mantis/runtime-${MANTIS_RUNTIME:-debian}:dev" } }
    secrets:
      - cluster_key
      - { source: account-2_crt, target: tls_cert }
      - { source: account-2_key, target: tls_key }
    volumes:
      - ./config/account-2.toml:/etc/mantis/node.toml:ro
      - ../local/registry.toml:/etc/mantis/registry.toml:ro
      - ../local/keys/deploy.pub:/etc/mantis/deploy.pub:ro
    networks:
      services: { ipv4_address: 10.77.0.21 }

  realm-2:
    <<: *node
    image: mantis/realm:dev
    build: { context: ../containers, dockerfile: realm.Containerfile, args: { RUNTIME: "mantis/runtime-${MANTIS_RUNTIME:-debian}:dev" } }
    secrets:
      - cluster_key
      - { source: realm-2_crt, target: tls_cert }
      - { source: realm-2_key, target: tls_key }
    volumes:
      - ./config/realm-2.toml:/etc/mantis/node.toml:ro
      - ../local/registry.toml:/etc/mantis/registry.toml:ro
      - ../local/keys/deploy.pub:/etc/mantis/deploy.pub:ro
    networks:
      services: { ipv4_address: 10.77.0.22 }

  social-2:
    <<: *node
    image: mantis/social:dev
    build: { context: ../containers, dockerfile: social.Containerfile, args: { RUNTIME: "mantis/runtime-${MANTIS_RUNTIME:-debian}:dev" } }
    secrets:
      - cluster_key
      - { source: social-2_crt, target: tls_cert }
      - { source: social-2_key, target: tls_key }
    volumes:
      - ./config/social-2.toml:/etc/mantis/node.toml:ro
      - ../local/registry.toml:/etc/mantis/registry.toml:ro
      - ../local/keys/deploy.pub:/etc/mantis/deploy.pub:ro
    networks:
      services: { ipv4_address: 10.77.0.23 }

  matchmaking-2:
    <<: *node
    image: mantis/matchmaking:dev
    build: { context: ../containers, dockerfile: matchmaking.Containerfile, args: { RUNTIME: "mantis/runtime-${MANTIS_RUNTIME:-debian}:dev" } }
    secrets:
      - cluster_key
      - { source: matchmaking-2_crt, target: tls_cert }
      - { source: matchmaking-2_key, target: tls_key }
    volumes:
      - ./config/matchmaking-2.toml:/etc/mantis/node.toml:ro
      - ../local/registry.toml:/etc/mantis/registry.toml:ro
      - ../local/keys/deploy.pub:/etc/mantis/deploy.pub:ro
    networks:
      services: { ipv4_address: 10.77.0.24 }

  ops-2:
    <<: *node
    image: mantis/ops:dev
    build: { context: ../containers, dockerfile: ops.Containerfile, args: { RUNTIME: "mantis/runtime-${MANTIS_RUNTIME:-debian}:dev" } }
    secrets:
      - cluster_key
      - live_key
      - operator_token
      - { source: ops-2_crt, target: tls_cert }
      - { source: ops-2_key, target: tls_key }
    volumes:
      - ./config/ops-2.toml:/etc/mantis/node.toml:ro
      - ../local/registry.toml:/etc/mantis/registry.toml:ro
      - ../local/keys/deploy.pub:/etc/mantis/deploy.pub:ro
      - ../local/out:/var/lib/mantis/out
    networks:
      services: { ipv4_address: 10.77.0.25 }
      ops: { ipv4_address: 10.79.0.11, gw_priority: 1 }
    ports:
      - "127.0.0.1:7481:7480/tcp"

  cell-host:
    <<: *node
    image: mantis/cell-host:dev
    build: { context: ../containers, dockerfile: cell-host.Containerfile, args: { RUNTIME: "mantis/runtime-${MANTIS_RUNTIME:-debian}:dev" } }
    secrets:
      - cluster_key
      - { source: cells-1_crt, target: tls_cert }
      - { source: cells-1_key, target: tls_key }
      - { source: game_crt, target: game_cert }
      - { source: game_key, target: game_key }
      - { source: ca_crt, target: game_ca }
    volumes:
      - ./config/cell-host.toml:/etc/mantis/node.toml:ro
      - ../local/registry.toml:/etc/mantis/registry.toml:ro
      - ../local/keys/deploy.pub:/etc/mantis/deploy.pub:ro
      - ../../packages/toy/cooked:/content/toy:ro
      - cells:/var/lib/mantis/state
      - ../local/out:/var/lib/mantis/out
    networks:
      services: { ipv4_address: 10.77.0.20 }
      game: { ipv4_address: 10.78.0.20, gw_priority: 1 }
    # Only the legacy adapter is published: native clients come through the gateway.
    ports:
      - "127.0.0.1:7401:7401/tcp"

  # The game's front door: native clients dial 127.0.0.1:7400/udp. It checks each entry token
  # with the realm (services network) and relays the session to the cell host serving it (game
  # network). Its client-facing certificate is rotated in place like the game listener's.
  gateway:
    <<: *node
    image: mantis/gateway:dev
    build: { context: ../containers, dockerfile: gateway.Containerfile, args: { RUNTIME: "mantis/runtime-${MANTIS_RUNTIME:-debian}:dev" } }
    secrets:
      - cluster_key
      - { source: gateway-1_crt, target: tls_cert }
      - { source: gateway-1_key, target: tls_key }
      - { source: gateway_front_crt, target: gateway_cert }
      - { source: gateway_front_key, target: gateway_key }
      - { source: ca_crt, target: clients_ca }
    volumes:
      - ./config/gateway.toml:/etc/mantis/node.toml:ro
      - ../local/registry.toml:/etc/mantis/registry.toml:ro
      - ../local/keys/deploy.pub:/etc/mantis/deploy.pub:ro
    networks:
      services: { ipv4_address: 10.77.0.30 }
      game: { ipv4_address: 10.78.0.30, gw_priority: 1 }
    ports:
      - "127.0.0.1:7400:7400/udp"

  # Headless bots (scripts/deploy-bots.ps1; `docker compose --profile bots run --rm bots`):
  # the toy package's `bots` from the cell-host image. They log in through the account and
  # realm roles (every instance, services network) and dial only the gateway (game network);
  # -Legacy: the legacy adapter, straight to the cell host's TCP port. Nothing published.
  bots:
    profiles: ["bots"]
    image: mantis/cell-host:dev
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    healthcheck: { disable: true }
    entrypoint: ["toy-server", "bots", "--cooked", "/content/toy", "--gateway", "10.78.0.30:7400",
      "--ca", "/run/secrets/ca", "--login", "/run/secrets/login", "--tls-ca", "/run/secrets/ca",
      "--tls-cert", "/run/secrets/tls_cert", "--tls-key", "/run/secrets/tls_key"]
    command: ["--count", "8", "--seconds", "30"]
    secrets:
      - { source: bots_login, target: login }
      - { source: ca_crt, target: ca }
      - { source: gateway-1_crt, target: tls_cert }
      - { source: gateway-1_key, target: tls_key }
    volumes:
      - ../../packages/toy/cooked:/content/toy:ro
    # No fixed addresses: several bot runs may play at once (they start after the cluster).
    networks: [services, game]

networks:
  services:
    internal: true
    # Docker hands out addresses (the bots') from the upper half, clear of the fixed ones.
    ipam: { config: [{ subnet: 10.77.0.0/24, ip_range: 10.77.0.128/25 }] }
  game:
    # No masquerade: a connection the cell host opens to another network on this host keeps
    # its own address, so the dashboard (which admits only the ops network's gateway, where
    # its published port arrives from) can refuse it. Docker forwards a published port's
    # container address from every bridge network on the host; unpublished ports are not.
    driver_opts: { com.docker.network.bridge.enable_ip_masquerade: "false" }
    ipam: { config: [{ subnet: 10.78.0.0/24, ip_range: 10.78.0.128/25 }] }
  ops:
    ipam: { config: [{ subnet: 10.79.0.0/24 }] }

volumes:
  pgdata:
  cells:

secrets:
  cluster_key: { file: ../local/keys/cluster.key }
  live_key: { file: ../local/keys/live.pk8 }
  operator_token: { file: ../local/keys/operator.token }
  pg_password: { file: ../local/secrets/pg_password }
  pg_conn: { file: ../local/secrets/pg.conn }
  # Each node's mutual-TLS certificate and key (mantisd certs), mounted as tls_cert and tls_key.
  persist-1_crt: { file: ../local/certs/persist-1.crt }
  persist-1_key: { file: ../local/certs/persist-1.key }
  account-1_crt: { file: ../local/certs/account-1.crt }
  account-1_key: { file: ../local/certs/account-1.key }
  realm-1_crt: { file: ../local/certs/realm-1.crt }
  realm-1_key: { file: ../local/certs/realm-1.key }
  social-1_crt: { file: ../local/certs/social-1.crt }
  social-1_key: { file: ../local/certs/social-1.key }
  matchmaking-1_crt: { file: ../local/certs/matchmaking-1.crt }
  matchmaking-1_key: { file: ../local/certs/matchmaking-1.key }
  ops-1_crt: { file: ../local/certs/ops-1.crt }
  ops-1_key: { file: ../local/certs/ops-1.key }
  # The standbys' certificates.
  account-2_crt: { file: ../local/certs/account-2.crt }
  account-2_key: { file: ../local/certs/account-2.key }
  realm-2_crt: { file: ../local/certs/realm-2.crt }
  realm-2_key: { file: ../local/certs/realm-2.key }
  social-2_crt: { file: ../local/certs/social-2.crt }
  social-2_key: { file: ../local/certs/social-2.key }
  matchmaking-2_crt: { file: ../local/certs/matchmaking-2.crt }
  matchmaking-2_key: { file: ../local/certs/matchmaking-2.key }
  ops-2_crt: { file: ../local/certs/ops-2.crt }
  ops-2_key: { file: ../local/certs/ops-2.key }
  cells-1_crt: { file: ../local/certs/cells-1.crt }
  cells-1_key: { file: ../local/certs/cells-1.key }
  gateway-1_crt: { file: ../local/certs/gateway-1.crt }
  gateway-1_key: { file: ../local/certs/gateway-1.key }
  # The cell host's game listener chain from the cluster CA (mantisd certs --server game: its
  # game-network address and the gateway's hosts_name), the gateway's client-facing chain
  # (--server gateway: 127.0.0.1 and its game-network address), and the CA bundle clients trust.
  game_crt: { file: ../local/certs/game.crt }
  game_key: { file: ../local/certs/game.key }
  gateway_front_crt: { file: ../local/certs/gateway.crt }
  gateway_front_key: { file: ../local/certs/gateway.key }
  ca_crt: { file: ../local/keys/ca.crt }
  # The bots' login targets (every account and realm instance) and the cluster key: written
  # by scripts/deploy-local.ps1.
  bots_login: { file: ../local/secrets/bots-login.txt }
