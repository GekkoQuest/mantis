# Owner: deploy-engine
# The cell-host node of the local compose cluster (deploy/compose/compose.yaml). Read strictly
# by mantisd: an unknown key is refused. Paths are container paths; secrets are files.
[node]
role = "cell-host"
instance = "cells-1"
registry = "/etc/mantis/registry.toml"
deploy_key = "/etc/mantis/deploy.pub"
cluster_key = "/run/secrets/cluster_key"
tls_cert = "/run/secrets/tls_cert"
tls_key = "/run/secrets/tls_key"
listen_rpc = "0.0.0.0:7520"
listen_health = "0.0.0.0:7620"
ready_timeout_s = 300
drain_grace_ms = 20000

[cell_host]
# What the realm hands to clients: the port the host publishes on loopback.
advertise = "127.0.0.1:7400"
state = "/var/lib/mantis/state"
poll_ms = 100
snapshot_every_ticks = 150

[package]
quic = "0.0.0.0:7400"
tcp = "0.0.0.0:7401"
cert_out = "/var/lib/mantis/out/toy-cert.der"
cooked = "/content/toy"
seed = 1
