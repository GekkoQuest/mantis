# Town avatars: toon-lit, tinted per kind by the `tint` parameter; skinned near,
# vertex-animated mid and far.
deformations = ["skinned", "vat"]

[lighting]
model = "toon"
bands = 3
softness = 0.2
shadow_tint = [0.55, 0.5, 0.7]

[rim]
color = [1.0, 0.95, 0.85]
power = 3.0
intensity = 0.4

[output]
base_color = "rgb"

[param.tint]
kind = "color"
default = [0.7, 0.45, 0.3, 1.0]

[node.tint]
op = "color_param"
name = "tint"

[node.rgb]
op = "swizzle"
components = "xyz"
inputs = ["tint"]
