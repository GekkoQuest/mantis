  { path = "f64::exp_m1", reason = "not deterministic across architectures (decision 0013)" },
  { path = "f64::ln", reason = "not deterministic across architectures (decision 0013)" },
  { path = "f64::log", reason = "not deterministic across architectures (decision 0013)" },
  { path = "f64::log2", reason = "not deterministic across architectures (decision 0013)" },
  { path = "f64::log10", reason = "not deterministic across architectures (decision 0013)" },
  { path = "f64::ln_1p", reason = "not deterministic across architectures (decision 0013)" },
  { path = "f64::powf", reason = "not deterministic across architectures (decision 0013)" },
  { path = "f64::powi", reason = "lowering differs by target and opt level" },
