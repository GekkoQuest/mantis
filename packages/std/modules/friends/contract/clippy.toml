disallowed-types = [
  { path = "std::time::Instant", reason = "no wall clock in simulation; inject a Clock (principle 8)" },
  { path = "std::time::SystemTime", reason = "no wall clock in simulation; inject a Clock (principle 8)" },
  { path = "std::collections::HashMap", reason = "randomly seeded iteration order; use BTreeMap or indexed storage" },
  { path = "std::collections::HashSet", reason = "randomly seeded iteration order; use BTreeSet or a bitset" },
  { path = "std::collections::hash_map::RandomState", reason = "randomly seeded; breaks determinism" },
]

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
